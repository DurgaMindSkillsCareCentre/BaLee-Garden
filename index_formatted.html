<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daily Buyer Dashboard</title>
<style>
body{margin:0;font-family:Arial;background:#101010;color:#fff}header{background:#1b1b1b;padding:18px;text-align:center;border-bottom:3px solid #d4af37}h1{margin:0;color:#d4af37}.container{max-width:900px;margin:auto;padding:16px}.card{background:#1d1d1d;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:16px}h2{color:#d4af37}button{width:100%;padding:14px;margin:6px 0;border:none;border-radius:10px;font-weight:bold}.gold{background:#d4af37}.blue{background:#1976d2;color:#fff}.green{background:#2e7d32;color:#fff}.orange{background:#ef6c00;color:#fff}textarea,input,select{width:100%;padding:10px;margin-top:8px;background:#000;color:#fff;border:1px solid #444;border-radius:8px;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.box{background:#000;padding:12px;border-radius:8px;text-align:center}
</style>
<script>
function openSearches(){["https://www.facebook.com/search/posts/?q=looking%20for%20land%20Madurai","https://www.facebook.com/search/groups/?q=Madurai%20Real%20Estate","https://www.google.com/search?q=commercial+land+buyer+Madurai"].forEach(u=>window.open(u,"_blank"));}
function analyzeLead(){let t=document.getElementById("lead").value.toLowerCase();document.getElementById("analysis").value=/looking|need|buyer|investment|budget/.test(t)?"Likely Buyer":"Likely Seller";}
function openWA(){window.open("https://wa.me/?text="+encodeURIComponent("Hi, I have a premium commercial corner plot near Alagar Kovil Highway, Madurai. Shall I share details?"),"_blank");}
function openComplete(){window.open("indexcomplete.html","_blank");}
</script>
</head>
<body>
<header><h1>Daily Buyer Dashboard</h1><p>Simple Daily Workflow</p></header>
<div class="container">
<div class="card"><h2>1. Find Buyers</h2><button class="gold" onclick="openSearches()">🔍 Open Buyer Searches</button></div>
<div class="card"><h2>2. Paste Buyer Post</h2><textarea id="lead" rows="8"></textarea><button class="blue" onclick="analyzeLead()">🧠 Analyze Lead</button><textarea id="analysis" rows="2" readonly></textarea></div>
<div class="card"><h2>3. Contact Buyer</h2><button class="green" onclick="openWA()">💬 WhatsApp Buyer</button><input placeholder="Buyer Name"><input placeholder="Phone"><select><option>New</option><option>Contacted</option><option>Interested</option><option>Site Visit</option><option>Negotiation</option><option>Closed</option></select></div>
<div class="card"><h2>4. Dashboard</h2><div class="grid"><div class="box">Buyers<br><b>0</b></div><div class="box">Contacted<br><b>0</b></div><div class="box">Replies<br><b>0</b></div><div class="box">Site Visits<br><b>0</b></div></div></div>
<div class="card"><h2>5. Advanced</h2><button class="orange" onclick="openComplete()">🚀 Open Complete System</button></div>
</div>
</body></html>

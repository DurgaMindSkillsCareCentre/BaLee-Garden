<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Buyer System</title><style>body{margin:0;background:#111;color:#fff;font-family:Arial}header{background:#1c1c1c;padding:18px;text-align:center;border-bottom:3px solid #d4af37}h1{color:#d4af37}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#1f1f1f;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:16px}h2{color:#d4af37}button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:10px;font-weight:bold}.g{background:#d4af37}.b{background:#1976d2;color:#fff}.gr{background:#2e7d32;color:#fff}.o{background:#ef6c00;color:#fff}textarea,input,select{width:100%;padding:10px;margin-top:8px;background:#000;color:#fff;border:1px solid #444;border-radius:8px;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.box{background:#000;padding:12px;border-radius:8px;text-align:center}</style><script>function s(q){window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank')}function a(){let t=document.getElementById('lead').value.toLowerCase();document.getElementById('res').value=/looking|need|buyer|investment|budget|required/.test(t)?'Likely Buyer':'Review'}function w(){window.open('https://wa.me/?text='+encodeURIComponent('Hi, I have a direct-owner commercial corner plot near Alagar Kovil Highway, Madurai. May I share the details?'),'_blank')}function p(){window.open('indexcomplete.html','_blank')}</script></head><body><header><h1>Daily Buyer System</h1><p>Daily Workflow</p></header><div class='wrap'><div class='card'><h2>Search Buyers</h2><button class='g' onclick="s('site:facebook.com/groups Madurai Real Estate')">Facebook Groups</button><button class='b' onclick="s('site:facebook.com looking for land Madurai')">Buyer Posts</button><button class='gr' onclick="s('commercial land buyer Madurai')">Commercial Buyers</button><button class='

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Buyer Dashboard</title><style>body{margin:0;font-family:Arial;background:#111;color:#fff}header{background:#1b1b1b;padding:16px;text-align:center;border-bottom:3px solid #d4af37}h1{margin:0;color:#d4af37}.card{background:#1d1d1d;margin:14px;padding:14px;border-radius:12px}button{width:100%;padding:14px;margin:6px 0;border:none;border-radius:10px;font-weight:bold}.gold{background:#d4af37;color:#000}.blue{background:#1976d2;color:#fff}.green{background:#2e7d32;color:#fff}.orange{background:#ef6c00;color:#fff}textarea,input,select{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:1px solid #444;background:#000;color:#fff;box-sizing:border-box}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#000;padding:10px;border-radius:8px;text-align:center}</style><script>function openSearch(){['https://www.google.com/search?q=site:facebook.com+looking+for+commercial+land+Madurai','https://www.facebook.com/search/posts/?q=looking%20for%20land%20Madurai','https://www.facebook.com/search/groups/?q=Madurai%20Real%20Estate','https://www.google.com/search?q=commercial+land+buyer+Madurai'].forEach(u=>window.open(u,'_blank'));}function analyze(){let t=document.getElementById('txt').value.toLowerCase();document.getElementById('result').value=/looking|need|want to buy|required|investment|budget/.test(t)?'Likely Buyer':'Likely Seller';}function wa(){window.open('https://wa.me/?text='+encodeURIComponent('Hi, I saw your property requirement. I have a premium commercial corner plot near Alagar Kovil Highway, Madurai. Shall I share details?'),'_blank');}function openComplete(){window.open('indexcomplete.html','_blank');}</script></head><body><header><h1>Daily Buyer Dashboard</h1><div>Simple workflow</div></header><div class='card'><h3>1. Find Buyers</h3><button class='gold' onclick='openSearch()'>🔍 Open Buyer Searches</button></div><div class='card'><h3>2. Paste Buyer Post</h3><textarea id='txt' rows='6'></textarea><button class='blue' onclick='analyze()'>🧠 Analyze</button><textarea id='result' rows='2' readonly></textarea></div><div class='card'><h3>3. Contact</h3><button class='green' onclick='wa()'>💬 WhatsApp Buyer</button><input placeholder='Buyer Name'><input placeholder='Phone'><select><option>New</option><option>Contacted</option><option>Interested</option><option>Site Visit</option><option>Negotiation</option><option>Closed</option></select></div><div class='card'><h3>4. Dashboard</h3><div class='stats'><div class='stat'>Buyers<br>0</div><div class='stat'>Contacted<br>0</div><div class='stat'>Replies<br>0</div><div class='stat'>Site Visits<br>0</div></div></div><div class='card'><button class='orange' onclick='openComplete()'>🚀 Open Complete System</button></div></body></html>
